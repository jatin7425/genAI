name: Keep Backend Awake

on:
  schedule:
    # Every 10 minutes — comfortably inside Render's free-tier 15-minute idle
    # spin-down window, so the service never sees enough idle time to sleep.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoints
        run: |
          if [ -z "${{ vars.RENDER_KEEPALIVE_URLS }}" ]; then
            echo "RENDER_KEEPALIVE_URLS repository variable is not set (Settings > Secrets and variables > Actions > Variables). Skipping ping."
            exit 0
          fi

          IFS=',' read -ra urls <<< "${{ vars.RENDER_KEEPALIVE_URLS }}"
          for raw_url in "${urls[@]}"; do
            url="$(echo "$raw_url" | xargs)"
            [ -z "$url" ] && continue
            echo "Pinging $url"
            curl -fsS -m 30 "$url" && echo "  -> awake" || echo "  -> ping failed (cold-starting or down)"
          done
