name: Keep Backend Awake

on:
  schedule:
    # Every 10 minutes — comfortably inside Render's free-tier 15-minute idle
    # spin-down window, so the service never sees enough idle time to sleep.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.RENDER_BACKEND_URL }}" ]; then
            echo "RENDER_BACKEND_URL repository variable is not set (Settings > Secrets and variables > Actions > Variables). Skipping ping."
            exit 0
          fi
          curl -fsS -m 30 "${{ vars.RENDER_BACKEND_URL }}/health" && echo "Backend is awake." || echo "Ping failed — backend may be cold-starting or down."
