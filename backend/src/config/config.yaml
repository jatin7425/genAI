API:
  base_url: ${LITELLM_BASE_URL}
  master_key: ${LITELLM_MASTER_KEY}
  Endpoints:
    chat: /v1/chat/completions
    models: ["/v1/models","/pools"]
    embeddings: /v1/embeddings

flags:
  is_terminal: true

# Conservative request budget when the gateway does not publish a model limit.
# Set explicit verified limits for your deployed models here if needed.
context:
  default_window: 8192
  model_windows: {}
